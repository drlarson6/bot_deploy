<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Prototype</title>
    <style>
        .user-message, .bot-message {
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 2px;
            display: block;
            max-width: 80%;
        }

        .user-message {

        }

        }

        #chatOutput {

            background-color: #212121;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
            background-color: #212121;
            display: flex;
            flex-direction: column;
        }

        #chatForm {
            display: flex;

        }
        
        #chatForm input[type="submit"]:active {

        }
        
        #chatForm button, #chatForm input[type="submit"], #chatForm input[type="text"] {
            align-self: center;
        }
    </style>
</head>
<body>

    <script>

    <script>
    (async () => {
    let sid = localStorage.getItem('sid');
    if (!sid) {
        const r = await fetch('/session/new', { method:'POST' });
        sid = (await r.json()).sid;
        localStorage.setItem('sid', sid);
    }
    const orig = window.fetch;
    window.fetch = (input, init = {}) => {
        const url = new URL(typeof input === 'string' ? input : input.url, location.origin);
        if (!url.searchParams.get('sid')) url.searchParams.set('sid', sid);
        const h = new Headers(init?.headers || {});
        h.set('X-Session-ID', sid);
        return orig(url, { ...init, headers: h });
    };
    window.sidReady = Promise.resolve(sid);
    })();
    </script>

    <script>
    (async () => {
    async function ensureSid() {
        let sid = localStorage.getItem('sid');
        if (!sid) {
        const r = await fetch('/session/new', { method:'POST' });
        sid = (await r.json()).sid;
        localStorage.setItem('sid', sid);
        }
        return sid;
    }

    const sid = await ensureSid();
    // Patch fetch so ALL requests include sid (query + header)
    const origFetch = window.fetch;
    window.fetch = (input, init = {}) => {
        const url = new URL(typeof input === 'string' ? input : input.url, location.origin);
        if (!url.searchParams.get('sid')) url.searchParams.set('sid', sid);
        const headers = new Headers(init.headers || {});
        headers.set('X-Session-ID', sid);
        return origFetch(url, { ...init, headers });
    };
    window.sidReady = Promise.resolve(sid);
    console.log('sid ready:', sid);
    })();
    </script>

    <div id="chatOutput"></div>

    <form id="chatForm" action="#" method="post">
        <input type="hidden" name="sid" id="sidField">
        <input type="text" id="userInput" name="user_input" autocomplete="off" placeholder="Type a message...">
        <input type="button" id="sendBtn" value="Send">
        <button type="button" id="sttButton" class="icon-button">
            <img id="micIcon" src="{{ url_for('static', filename='images/microphone-off.svg') }}" alt="Microphone">
        </button>
        
    </form>

    <script>
    window.sidReady = (async () => {
    let sid = localStorage.getItem('sid');
    if (!sid) {
        const r = await fetch('/session/new', { method: 'POST' });
        if (!r.ok) throw new Error('session/new failed ' + r.status);
        sid = (await r.json()).sid;
        localStorage.setItem('sid', sid);
    }

    // ensure a SID exists (no new const)
    if (!localStorage.sid) {
        localStorage.sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    }


    // 🔁 NEW apiFetch: send header AND add ?sid=... to the URL
    window.apiFetch = (url, opts = {}) => {
        if (!url) throw new Error('apiFetch: missing url');
        const sid = localStorage.sid;                     // read it here
        const u = new URL(url, location.origin);
        u.searchParams.set('sid', sid);                   // fallback query
        opts.headers = Object.assign({}, opts.headers, { 'X-Session-ID': sid });
        return fetch(u, opts);
    };


    return sid;
    })();
    </script>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <script>window.AUTO_TTS = false;</script>   //Temporary disable auto TTS
<script>
    let stream, audioContext, source, processor, audioChunks, continueConversation;

    
    let micState = "idle"; // "idle", "recording", "speaking"

    let safariAudioUnlocked = false;

async function handleMicrophoneClick() {
    // ✅ If already recording, stop immediately and process audio
    if (micState === "recording") {
        processor.disconnect();
        source.disconnect();

        const audioBlob = exportWAV(audioChunks, audioContext.sampleRate);
        const formData = new FormData();
        formData.append('audio', audioBlob, 'audio.wav');

        handleAudioPost(formData, continueConversation, document.getElementById('micIcon'));
        micState = "idle";
        return;
    }

    // ✅ Safari unlock (unchanged)
    if (!safariAudioUnlocked) {
        const dummy = new Audio();
        dummy.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA...";
        dummy.play().catch(()=>{});
        safariAudioUnlocked = true;
    }

    // ✅ Toggle mic icon (for starting new recording)
    let micIcon = document.getElementById('micIcon');
    micIcon.src = 'static/images/microphone-on.svg';
    micIcon.alt = 'Microphone on';

    // ✅ Start new recording
    micState = "recording";
    continueConversation = true;
    audioChunks = [];

    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext();
        source = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(1024, 1, 1);

        source.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = (e) => {
            audioChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        };

    } catch (error) {
        console.error('Error accessing microphone:', error);
        micState = "idle";
    }
}

    function finishRecording() {
        processor.disconnect();
        source.disconnect();

        const audioBlob = exportWAV(audioChunks, audioContext.sampleRate);
        const formData = new FormData();
        formData.append('audio', audioBlob, 'audio.wav');

        handleAudioPost(formData, continueConversation, micIcon);
        micState = "idle";
    }

    async function handleAudioPost(formData, continueConversation, micIcon) {
        while (continueConversation) {
            const response = await fetch('/record_and_transcribe', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.message[0].transcript.trim().length > 0) {
                updateTranscript(data.message[0].transcript);
            }
            if (data.message[0].response_text.trim().length > 0) {
                updateResponse(data.message[0].response_text);
            }
            chatOutput.scrollTop = chatOutput.scrollHeight;

            continueConversation = data.message[0].follow_up_needed;
        }

        micIcon.src = 'static/images/microphone-off.svg';
        micIcon.alt = 'Microphone off';
    }

    function exportWAV(audioChunks, sampleRate) {
        const buffer = mergeBuffers(audioChunks);
        const wavBuffer = encodeWAV(buffer, sampleRate);
        return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    function mergeBuffers(audioChunks) {
        const length = audioChunks.reduce((acc, chunk) => acc + chunk.length, 0);
        const result = new Float32Array(length);
        let offset = 0;
        audioChunks.forEach(chunk => {
            result.set(chunk, offset);
            offset += chunk.length;
        });
        return result;
    }

    function encodeWAV(buffer, sampleRate) {
        const bufferLength = buffer.length * 2 + 44;
        const wav = new DataView(new ArrayBuffer(bufferLength));

        writeString(wav, 0, 'RIFF');
        wav.setUint32(4, 36 + buffer.length * 2, true);
        writeString(wav, 8, 'WAVE');

        writeString(wav, 12, 'fmt ');
        wav.setUint32(16, 16, true);
        wav.setUint16(20, 1, true);
        wav.setUint16(22, 1, true);
        wav.setUint32(24, sampleRate, true);
        wav.setUint32(28, sampleRate * 2, true);
        wav.setUint16(32, 2, true);
        wav.setUint16(34, 16, true);

        writeString(wav, 36, 'data');
        wav.setUint32(40, buffer.length * 2, true);

        let offset = 44;
        for (let i = 0; i < buffer.length; i++, offset += 2) {
            const sample = Math.max(-1, Math.min(1, buffer[i]));
            wav.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        }

        return wav;
    }

    function writeString(dataview, offset, string) {
        for (let i = 0; i < string.length; i++) {
            dataview.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    function updateTranscript(transcript) {
        const userMessageDiv = document.createElement('div');
        userMessageDiv.textContent = 'Me: ' + transcript;
        userMessageDiv.classList.add('user-message');
        document.getElementById('chatOutput').appendChild(userMessageDiv);
    }

    function updateResponse(response) {
        if (response && response.trim() && !response.includes("Intent")) {
            const botMessageDiv = document.createElement('div');
            botMessageDiv.textContent = 'Agent: ' + response;
            botMessageDiv.classList.add('bot-message');
            document.getElementById('chatOutput').appendChild(botMessageDiv);

            //Turn off auto TTS for now
            //speakWithGoogleTTS(response); // ✅ central TTS logic
        }
    }

    function speakWithGoogleTTS(text) {

        if (!window.AUTO_TTS) return;   // text-only mode (temporary disable)

        fetch('/speak', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        })
        .then(res => {
            if (!res.ok) throw new Error("TTS failed");
            return res.blob();
        })
        .then(blob => {
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            window.speakingAudio = audio;
            micState = "speaking";   // 🔹 add here
            audio.onended = () => { micState = "idle"; };

            return audio.play().then(() => {
                console.log("✅ Audio played");
            }).catch(err => {
                console.warn("⚠️ Autoplay blocked. Waiting for click...");
                const retry = () => {
                    audio.play().then(() => {
                        console.log("✅ Played after click");
                        document.removeEventListener("click", retry);
                    }).catch(err => {
                        console.error("❌ Still blocked:", err);
                    });
                };
                document.addEventListener("click", retry);
            });
        })
        .catch(err => console.error("Fetch or playback error:", err));
    }

    async function sendToGPT(prompt) {
        // ensure sid + apiFetch are initialized
        if (window.sidReady) { await window.sidReady; }

        return apiFetch('/ask-gpt', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-Session-ID': localStorage.sid
            },
            body: JSON.stringify({ prompt })
        })
        .then(r => r.json())
        .then(data => {
            console.log("GPT-4o reply:", data.reply);
            return data;
        })
        .catch(err => {
            console.error("Error calling GPT:", err);
            throw err;
        });
    }

    // Ensure the hidden SID is populated on page load
    (function ensureSidField() {
        const sid = localStorage.getItem('sid') || '';
        const sidInput = document.getElementById('sidField');
        if (sidInput && sid) sidInput.value = sid;
    })();

    

// === SID + form setup (use existing chatForm) ===

// Ensure a browser SID exists (once)
if (!localStorage.getItem('sid')) {
  localStorage.setItem('sid', crypto.randomUUID());
}

// Prevent native navigation; we always handle submit via JS
if (chatForm) {
  chatForm.setAttribute('action', '#');
  // capture:true ensures we stop any native submit early
  chatForm.addEventListener('submit', e => e.preventDefault(), { capture: true });
}

// Wire the Send button to trigger the same submit handler
document.getElementById('sendBtn')?.addEventListener('click', () => {
  chatForm?.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
});

// Drop-in replacement for your current submit handler
chatForm.addEventListener('submit', async function (e) {
  e.preventDefault();

  // 1) Ensure a SID exists
  let sid = localStorage.getItem('sid');
  if (!sid) {
    sid = (crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2)
    );
    localStorage.setItem('sid', sid);
  }

  // 2) Keep hidden field in sync (backend fallbacks)
  const sidField = document.getElementById('sidField');
  if (sidField && sidField.value !== sid) sidField.value = sid;

  // 3) Read input
  const userInputEl = document.getElementById('userInput');
  const userInputValue = (userInputEl?.value || '').trim();
  if (!userInputValue) return;

  console.log('Submitted input:', userInputValue);

  // 4) Show user bubble immediately
  const userMessageDiv = document.createElement('div');
  userMessageDiv.textContent = 'Me: ' + userInputValue;
  userMessageDiv.classList.add('user-message');
  chatOutput.appendChild(userMessageDiv);

  // 5) Call backend: /handle-form with FormData + X-Session-ID header
  //    (no JSON Content-Type; let the browser set multipart boundary)
  try {
    const formData = new FormData(chatForm); // includes user_input + sidField
    const r = await apiFetch('/handle-form', {
      method: 'POST',
      headers: {
        'X-Session-ID': sid
      },
      body: formData
    });

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const data = await r.json();
    const replyText = (data && (data.response || data.reply)) || '(No reply)';

    if (replyText.trim()) {
      const botMessageDiv = document.createElement('div');
      botMessageDiv.textContent = 'Agent: ' + replyText;
      botMessageDiv.classList.add('bot-message');
      chatOutput.appendChild(botMessageDiv);
    }
  } catch (err) {
    console.error('Error calling /handle-form:', err);
    const errDiv = document.createElement('div');
    errDiv.textContent = 'Agent: (error contacting server)';
    errDiv.classList.add('bot-message');
    chatOutput.appendChild(errDiv);
  } finally {
    // 6) Reset UI
    if (userInputEl) userInputEl.value = '';
    document.getElementById('userInput').style.display = 'block';
    document.getElementById('sttButton').style.display = 'block';
    chatOutput.scrollTop = chatOutput.scrollHeight;
  }
});
document.getElementById('sttButton').addEventListener('click', handleMicrophoneClick);
document.getElementById('sendBtn').addEventListener('click', () => {
  // call your submit handler body directly, or dispatch a cancelable submit
  form?.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
});
</script>
